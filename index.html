<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">

<title>Stock Manager</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f4f6;
  color:#111827;
}

button,
input{
  font:inherit;
}

.app{
  width:94%;
  max-width:1200px;
  margin:25px auto 50px;
}

/* HEADER */

.header{
  background:#111827;
  color:#fff;
  padding:25px;
  border-radius:20px;
  margin-bottom:20px;
}

.header h1{
  margin:0 0 7px;
  font-size:28px;
}

.header p{
  margin:0;
  color:#cbd5e1;
  font-size:14px;
}

/* DATABASE STATUS */

.status{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:15px;
  font-size:13px;
  color:#bbf7d0;
}

.status-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#22c55e;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:20px;
}

.stat{
  background:#fff;
  border-radius:16px;
  padding:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.stat-label{
  display:block;
  color:#64748b;
  font-size:13px;
  margin-bottom:8px;
}

.stat-number{
  font-size:30px;
  font-weight:800;
}

/* CARD */

.card{
  background:#fff;
  border-radius:18px;
  padding:22px;
  margin-bottom:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.card-title{
  margin:0 0 18px;
  font-size:20px;
}

/* FORM */

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.field label{
  font-size:13px;
  font-weight:700;
  color:#374151;
}

.field input{
  width:100%;
  border:1px solid #d1d5db;
  border-radius:10px;
  padding:13px;
  outline:none;
  background:#fff;
}

.field input:focus{
  border-color:#111827;
  box-shadow:0 0 0 3px rgba(17,24,39,.08);
}

.full{
  grid-column:1/-1;
}

/* IMAGE UPLOAD */

.upload-box{
  border:2px dashed #cbd5e1;
  border-radius:14px;
  padding:20px;
  text-align:center;
  background:#f8fafc;
}

.upload-box input{
  border:0;
  width:100%;
}

.preview{
  display:none;
  width:150px;
  height:150px;
  object-fit:cover;
  border-radius:14px;
  margin:15px auto 0;
  border:1px solid #e5e7eb;
}

/* BUTTONS */

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:20px;
}

.btn{
  border:0;
  border-radius:10px;
  padding:13px 18px;
  cursor:pointer;
  font-weight:700;
}

.btn-primary{
  background:#111827;
  color:#fff;
}

.btn-secondary{
  background:#e5e7eb;
  color:#111827;
}

.btn-blue{
  background:#2563eb;
  color:#fff;
}

.btn-green{
  background:#059669;
  color:#fff;
}

.btn-red{
  background:#dc2626;
  color:#fff;
}

#cancelBtn{
  display:none;
}

/* SEARCH */

.search{
  width:100%;
  padding:14px;
  border:1px solid #d1d5db;
  border-radius:11px;
  outline:none;
  margin-bottom:18px;
}

/* PRODUCTS */

.products{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.product{
  border:1px solid #e5e7eb;
  border-radius:16px;
  overflow:hidden;
  background:#fff;
}

.product-image{
  width:100%;
  height:200px;
  object-fit:cover;
  display:block;
  background:#f1f5f9;
}

.no-image{
  height:200px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f1f5f9;
  color:#94a3b8;
}

.product-body{
  padding:16px;
}

.product-name{
  font-size:18px;
  font-weight:800;
  margin-bottom:6px;
}

.article{
  font-size:12px;
  color:#64748b;
  margin-bottom:12px;
}

.price-row{
  display:flex;
  align-items:center;
  gap:9px;
  margin-bottom:10px;
}

.old-price{
  color:#94a3b8;
  text-decoration:line-through;
  font-size:13px;
}

.sale-price{
  font-size:19px;
  font-weight:800;
}

.stock-row{
  padding:10px;
  border-radius:9px;
  background:#f8fafc;
  font-size:13px;
  margin-bottom:12px;
}

.stock-low{
  color:#dc2626;
  font-weight:800;
}

.stock-ok{
  color:#059669;
  font-weight:800;
}

.product-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.edit-btn{
  background:#e0e7ff;
  color:#3730a3;
}

.delete-btn{
  background:#fee2e2;
  color:#b91c1c;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:45px 20px;
  color:#64748b;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%) translateY(20px);
  background:#111827;
  color:#fff;
  padding:13px 20px;
  border-radius:10px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:99999;
  max-width:90%;
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* MOBILE */

@media(max-width:850px){

  .products{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:650px){

  .app{
    width:94%;
    margin-top:15px;
  }

  .header{
    padding:20px;
  }

  .header h1{
    font-size:23px;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .products{
    grid-template-columns:1fr;
  }

  .actions{
    flex-direction:column;
  }

  .actions .btn{
    width:100%;
  }

}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <div class="header">

    <h1>📦 Stock Manager</h1>

    <p>
      Manage products, prices, images and inventory.
    </p>

    <div class="status">
      <span class="status-dot"></span>
      <span id="databaseStatus">
        Local Database Ready
      </span>
    </div>

  </div>


  <!-- STATISTICS -->

  <div class="stats">

    <div class="stat">
      <span class="stat-label">
        Total Articles
      </span>

      <span
        class="stat-number"
        id="totalArticles">
        0
      </span>
    </div>


    <div class="stat">
      <span class="stat-label">
        Total Pieces
      </span>

      <span
        class="stat-number"
        id="totalPieces">
        0
      </span>
    </div>


    <div class="stat">
      <span class="stat-label">
        Low Stock
      </span>

      <span
        class="stat-number"
        id="lowStock">
        0
      </span>
    </div>

  </div>


  <!-- PRODUCT FORM -->

  <div class="card">

    <h2
      class="card-title"
      id="formTitle">
      Add New Product
    </h2>


    <div class="form-grid">


      <!-- ARTICLE -->

      <div class="field">

        <label>
          Article Number
        </label>

        <input
          id="article"
          type="text"
          placeholder="Example: ART-001">

      </div>


      <!-- NAME -->

      <div class="field">

        <label>
          Product Name
        </label>

        <input
          id="productName"
          type="text"
          placeholder="Example: Premium Shirt">

      </div>


      <!-- REAL PRICE -->

      <div class="field">

        <label>
          Real / MRP Price
        </label>

        <input
          id="realPrice"
          type="number"
          min="0"
          placeholder="1000">

      </div>


      <!-- SALE PRICE -->

      <div class="field">

        <label>
          Sale Price
        </label>

        <input
          id="salePrice"
          type="number"
          min="0"
          placeholder="799">

      </div>


      <!-- QUANTITY -->

      <div class="field">

        <label>
          Quantity
        </label>

        <input
          id="quantity"
          type="number"
          min="0"
          value="0">

      </div>


      <!-- LOW STOCK -->

      <div class="field">

        <label>
          Low Stock Alert At
        </label>

        <input
          id="lowAlert"
          type="number"
          min="0"
          value="5">

      </div>


      <!-- IMAGE -->

      <div class="field full">

        <label>
          Product Image
        </label>

        <div class="upload-box">

          <input
            id="imageInput"
            type="file"
            accept="image/*">

          <img
            id="imagePreview"
            class="preview"
            alt="Preview">

        </div>

      </div>

    </div>


    <!-- ACTIONS -->

    <div class="actions">

      <button
        class="btn btn-primary"
        id="saveBtn"
        type="button">
        Save Product
      </button>


      <button
        class="btn btn-secondary"
        id="cancelBtn"
        type="button">
        Cancel Edit
      </button>


      <button
        class="btn btn-blue"
        id="backupBtn"
        type="button">
        Backup Data
      </button>


      <button
        class="btn btn-green"
        id="restoreBtn"
        type="button">
        Restore Data
      </button>

      <input
        id="restoreInput"
        type="file"
        accept=".json,application/json"
        hidden>

    </div>

  </div>


  <!-- PRODUCTS -->

  <div class="card">

    <h2 class="card-title">
      Products
    </h2>


    <input
      id="searchInput"
      class="search"
      type="search"
      placeholder="Search product or article number...">


    <div
      id="products"
      class="products">

    </div>

  </div>

</div>


<!-- TOAST -->

<div
  id="toast"
  class="toast">
</div>


<script>

/* =====================================================
   LOCAL DATABASE
===================================================== */

const DB_NAME = "StockManagerDatabase";

const DB_VERSION = 1;

const STORE_NAME = "products";

let database = null;

let editingId = null;

let newImageBlob = null;


/* =====================================================
   ELEMENTS
===================================================== */

const articleInput =
  document.getElementById("article");

const nameInput =
  document.getElementById("productName");

const realPriceInput =
  document.getElementById("realPrice");

const salePriceInput =
  document.getElementById("salePrice");

const quantityInput =
  document.getElementById("quantity");

const lowAlertInput =
  document.getElementById("lowAlert");

const imageInput =
  document.getElementById("imageInput");

const imagePreview =
  document.getElementById("imagePreview");

const saveBtn =
  document.getElementById("saveBtn");

const cancelBtn =
  document.getElementById("cancelBtn");

const backupBtn =
  document.getElementById("backupBtn");

const restoreBtn =
  document.getElementById("restoreBtn");

const restoreInput =
  document.getElementById("restoreInput");

const searchInput =
  document.getElementById("searchInput");

const productsContainer =
  document.getElementById("products");


/* =====================================================
   OPEN DATABASE
===================================================== */

function openDatabase(){

  return new Promise((resolve,reject)=>{

    if(!window.indexedDB){

      reject(
        new Error(
          "IndexedDB is not supported by this browser."
        )
      );

      return;

    }


    const request =
      indexedDB.open(
        DB_NAME,
        DB_VERSION
      );


    request.onupgradeneeded =
      function(event){

        const db =
          event.target.result;


        if(
          !db.objectStoreNames.contains(
            STORE_NAME
          )
        ){

          const store =
            db.createObjectStore(
              STORE_NAME,
              {
                keyPath:"id",
                autoIncrement:true
              }
            );


          store.createIndex(
            "article",
            "article",
            {
              unique:false
            }
          );


          store.createIndex(
            "name",
            "name",
            {
              unique:false
            }
          );

        }

      };


    request.onsuccess =
      function(event){

        database =
          event.target.result;


        database.onversionchange =
          function(){

            database.close();

          };


        resolve(database);

      };


    request.onerror =
      function(){

        reject(request.error);

      };

  });

}


/* =====================================================
   GET ALL PRODUCTS
===================================================== */

function getAllProducts(){

  return new Promise((resolve,reject)=>{

    const transaction =
      database.transaction(
        STORE_NAME,
        "readonly"
      );


    const store =
      transaction.objectStore(
        STORE_NAME
      );


    const request =
      store.getAll();


    request.onsuccess =
      function(){

        resolve(
          request.result || []
        );

      };


    request.onerror =
      function(){

        reject(request.error);

      };

  });

}


/* =====================================================
   ADD
===================================================== */

function addProduct(product){

  return new Promise((resolve,reject)=>{

    const transaction =
      database.transaction(
        STORE_NAME,
        "readwrite"
      );


    const store =
      transaction.objectStore(
        STORE_NAME
      );


    const request =
      store.add(product);


    request.onsuccess =
      function(){

        resolve(request.result);

      };


    request.onerror =
      function(){

        reject(request.error);

      };

  });

}


/* =====================================================
   UPDATE
===================================================== */

function updateProduct(product){

  return new Promise((resolve,reject)=>{

    const transaction =
      database.transaction(
        STORE_NAME,
        "readwrite"
      );


    const store =
      transaction.objectStore(
        STORE_NAME
      );


    const request =
      store.put(product);


    request.onsuccess =
      function(){

        resolve(true);

      };


    request.onerror =
      function(){

        reject(request.error);

      };

  });

}


/* =====================================================
   DELETE
===================================================== */

function deleteProduct(id){

  return new Promise((resolve,reject)=>{

    const transaction =
      database.transaction(
        STORE_NAME,
        "readwrite"
      );


    const store =
      transaction.objectStore(
        STORE_NAME
      );


    const request =
      store.delete(id);


    request.onsuccess =
      function(){

        resolve(true);

      };


    request.onerror =
      function(){

        reject(request.error);

      };

  });

}


/* =====================================================
   IMAGE COMPRESSION
===================================================== */

function compressImage(file){

  return new Promise((resolve,reject)=>{

    const reader =
      new FileReader();


    reader.onload =
      function(event){

        const img =
          new Image();


        img.onload =
          function(){

            const MAX_SIZE = 1200;

            let width =
              img.width;

            let height =
              img.height;


            if(width > MAX_SIZE){

              height =
                height *
                (MAX_SIZE / width);

              width =
                MAX_SIZE;

            }


            if(height > MAX_SIZE){

              width =
                width *
                (MAX_SIZE / height);

              height =
                MAX_SIZE;

            }


            const canvas =
              document.createElement(
                "canvas"
              );


            canvas.width =
              Math.round(width);

            canvas.height =
              Math.round(height);


            const context =
              canvas.getContext(
                "2d"
              );


            context.drawImage(
              img,
              0,
              0,
              canvas.width,
              canvas.height
            );


            canvas.toBlob(
              function(blob){

                if(blob){

                  resolve(blob);

                }else{

                  reject(
                    new Error(
                      "Image compression failed."
                    )
                  );

                }

              },
              "image/jpeg",
              0.82
            );

          };


        img.onerror =
          function(){

            reject(
              new Error(
                "Could not read image."
              )
            );

          };


        img.src =
          event.target.result;

      };


    reader.onerror =
      function(){

        reject(reader.error);

      };


    reader.readAsDataURL(file);

  });

}


/* =====================================================
   IMAGE SELECT
===================================================== */

imageInput.addEventListener(
  "change",
  async function(){

    const file =
      this.files[0];


    if(!file){

      return;

    }


    if(
      !file.type.startsWith(
        "image/"
      )
    ){

      showToast(
        "Please select an image."
      );

      this.value = "";

      return;

    }


    try{

      newImageBlob =
        await compressImage(file);


      imagePreview.src =
        URL.createObjectURL(
          newImageBlob
        );


      imagePreview.style.display =
        "block";


      showToast(
        "Image ready to save."
      );

    }catch(error){

      console.error(error);

      showToast(
        "Image could not be processed."
      );

      this.value = "";

    }

  }
);


/* =====================================================
   SAVE / UPDATE BUTTON
===================================================== */

saveBtn.addEventListener(
  "click",
  saveCurrentProduct
);


async function saveCurrentProduct(){

  if(!database){

    showToast(
      "Database is not ready. Refresh the page."
    );

    return;

  }


  const article =
    articleInput.value.trim();

  const name =
    nameInput.value.trim();

  const realPrice =
    Number(
      realPriceInput.value || 0
    );

  const salePrice =
    Number(
      salePriceInput.value || 0
    );

  const quantity =
    Number(
      quantityInput.value || 0
    );

  const lowAlert =
    Number(
      lowAlertInput.value || 0
    );


  if(!article){

    showToast(
      "Article Number enter karo."
    );

    articleInput.focus();

    return;

  }


  if(!name){

    showToast(
      "Product Name enter karo."
    );

    nameInput.focus();

    return;

  }


  if(quantity < 0){

    showToast(
      "Quantity 0 se kam nahi ho sakti."
    );

    return;

  }


  saveBtn.disabled =
    true;


  try{

    let imageBlob =
      newImageBlob;


    /*
      EDIT MODE:
      Agar nayi image select nahi ki,
      purani image ko preserve karo.
    */

    if(
      editingId !== null &&
      !imageBlob
    ){

      const products =
        await getAllProducts();


      const oldProduct =
        products.find(
          product =>
            product.id === editingId
        );


      if(oldProduct){

        imageBlob =
          oldProduct.image || null;

      }

    }


    const product = {

      article:article,

      name:name,

      realPrice:realPrice,

      salePrice:salePrice,

      quantity:quantity,

      lowAlert:lowAlert,

      image:imageBlob,

      updatedAt:Date.now()

    };


    if(editingId === null){

      await addProduct(product);

      showToast(
        "✅ Product saved successfully."
      );

    }else{

      product.id =
        editingId;


      await updateProduct(product);

      showToast(
        "✅ Product updated successfully."
      );

    }


    resetForm();

    await renderProducts();

  }catch(error){

    console.error(
      "SAVE ERROR:",
      error
    );


    showToast(
      "❌ Save failed. Please try again."
    );

  }finally{

    saveBtn.disabled =
      false;

  }

}


/* =====================================================
   EDIT
=================================================
